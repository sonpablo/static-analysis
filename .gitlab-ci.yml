workflow:
  rules:
    # Always run for tags
    - if: $CI_COMMIT_TAG
    # Skip chore(release) commits, run everything else
    - if: $CI_COMMIT_MESSAGE !~ /^chore\(release\):/

stages:
  - build
  - tag
  - package

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
  image: node:24
  before_script:
    - echo "@neuraverse:registry=https://gitlab.hrg.systems/api/v4/packages/npm/" >> .npmrc
    - echo "//gitlab.hrg.systems/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
  script:
    - npm ci

release:
  stage: tag
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  image: node:24
  before_script:
    - echo "@neuraverse:registry=https://gitlab.hrg.systems/api/v4/packages/npm/" >> .npmrc
    - echo "//gitlab.hrg.systems/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm install -g semantic-release@^24 @semantic-release/gitlab@^13 @semantic-release/git@^10 @semantic-release/changelog@^6
  script:
    - GITLAB_TOKEN=${GITLAB_TOKEN} npx semantic-release@24
  # This creates the tag and chore(release) commit

package:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG  # Only run when a tag is created
  image: node:24
  before_script:
    - echo "@neuraverse:registry=https://gitlab.hrg.systems/api/v4/packages/npm/" >> .npmrc
    - echo "//gitlab.hrg.systems/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm install -g semantic-release@^24 @semantic-release/gitlab@^13 @semantic-release/git@^10 @semantic-release/changelog@^6
  script:
    - npm i
    - rm -f .npmrc
    - echo "//gitlab.hrg.systems/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" > .npmrc
    - echo "@neuraverse:registry=https://gitlab.hrg.systems/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" >> .npmrc
    - npm publish
